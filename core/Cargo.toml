[package]
name = "subcheck-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "subcheck's library: reading, checking and fixing the text subtitles in MKV files"
license.workspace = true

[features]
# What tests share (`test_support`, and review's `tests_support` modules), for tests that see only
# what the library exports: its integration tests, and the other members'. Dev-dependencies turn
# it on (theirs, and for this package's own tests the one on itself below); no normal one does.
test-support = ["dep:tempfile"]

[dependencies]
libc.workspace = true
anyhow.workspace = true
flate2.workspace = true
thiserror.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
rustfft.workspace = true
signal-hook.workspace = true
rustix.workspace = true
rusqlite.workspace = true
tempfile = { workspace = true, optional = true }

[dev-dependencies]
subcheck-core = { path = ".", features = ["test-support"] }
tempfile.workspace = true
# `group`'s tests point a child's stderr elsewhere.
rustix = { workspace = true, features = ["stdio"] }

[lints]
workspace = true
