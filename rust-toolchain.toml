# The one Rust that dev/check-all.sh and both forges' CI build with, so the local gate and CI lint
# with the same clippy (daveyutils#52).
#
# rustup finds this file from the working directory upward, so it governs every cargo run inside
# the repository.
#
# To move on: change `channel` here and, with it, the `image: rust:<version>-bookworm` lines in
# .forgejo/workflows/ci.yml and .forgejo/workflows/advisories.yml. A mismatch still runs this
# version -- rustup honours the file inside the image too, and the advisories job installs its
# channel -- but the jobs then download it first. An editor's rust-analyzer, through rustup's
# proxy, needs `rustup component add rust-analyzer` after a bump; it is not listed below because
# CI would then download it in every job.
[toolchain]
channel = "1.99.1"
profile = "minimal"
components = ["rustfmt", "clippy"]
