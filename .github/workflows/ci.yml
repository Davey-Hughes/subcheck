name: CI

# The GitHub half of a two-forge CI: Forgejo's runners are docker only, so the
# macOS jobs run here, on the push mirror. Forgejo pushes every branch, so a
# pull request's branch runs here as a `push` event; nothing opens pull requests
# on GitHub. See .forgejo/workflows/ci.yml for why this is not a merge gate.
on:
  push:
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      # The toolchain rust-toolchain.toml names, with its components.
      - run: rustup toolchain install
      # The `apply` tests remux with mkvmerge and the `audio` tests decode with
      # ffmpeg: both installed on Linux and required there (SUBCHECK_NEED_MKVMERGE,
      # SUBCHECK_NEED_FFMPEG), left out on macOS, where those tests skip. The
      # other tests read MKV fixtures committed under core/tests/fixtures/.
      # mkvtoolnix from MKVToolNix's own apt repository, pinned to the version the
      # Forgejo job installs, its key checked the same way (see why there):
      # Ubuntu's own is years behind.
      - name: Install mkvtoolnix
        if: runner.os == 'Linux'
        run: |
          . /etc/os-release
          key=/etc/apt/keyrings/gpg-pub-moritzbunkus.gpg
          sudo install -d /etc/apt/keyrings
          sudo curl -fsSL -o "$key" https://mkvtoolnix.download/gpg-pub-moritzbunkus.gpg
          fpr=$(gpg --show-keys --with-colons "$key" | awk -F: '$1 == "pub" { getline; print $10 }')
          [ "$fpr" = D9199745B0545F2E8197062B0F92290A445B9007 ] || { echo "unexpected MKVToolNix key: $fpr" >&2; exit 1; }
          echo "deb [signed-by=$key] https://mkvtoolnix.download/$ID/ $VERSION_CODENAME main" | sudo tee /etc/apt/sources.list.d/mkvtoolnix.list >/dev/null
          sudo apt-get update && sudo apt-get install -y --no-install-recommends 'mkvtoolnix=103.0-*'
      - name: Install ffmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends ffmpeg
      #
      # Keep these three in step with the job in .forgejo/workflows/ci.yml, all
      # but its coverage floor. One check of the floor, in the job that gates, is
      # enough; and on macOS, where the `apply` and `audio` tests skip, the share
      # would be of a smaller suite than the one the floor is set for.
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
        env:
          SUBCHECK_NEED_MKVMERGE: ${{ runner.os == 'Linux' && '1' || '' }}
          SUBCHECK_NEED_FFMPEG: ${{ runner.os == 'Linux' && '1' || '' }}

  # The Qt app on macOS, built and tested as the gui job in .forgejo/workflows/ci.yml does it,
  # less clang-format, which one platform is enough for, and the C++ floor, which is measured
  # there only, as the Rust's is. Like that job it does not gate, so look at it before merging, as
  # at the macOS leg above. Keep the steps the two share in step.
  gui-macos:
    name: gui-macos
    runs-on: macos-latest
    # A hang outside the tests, which CTest limits one by one (gui/qt/CMakeLists.txt), fails the job
    # rather than running to GitHub's six hours, on every push of every branch: a download, a build.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: rustc --version
      # Qt's two formulae the app uses, not `qt`, which is every Qt module; mpv, whose library
      # draws the video; and for MpvQt's build, KDE's CMake modules and pkgconf, which its
      # FindLibmpv.cmake runs and the runner's image need not have.
      - run: brew install qtbase qtdeclarative mpv extra-cmake-modules pkgconf corrosion ninja
      # MpvQt, which Homebrew does not package, at the release Arch's package is, checked by its
      # commit, as a tag can move. Built outside the checkout, so nothing of it is in build/.
      - name: Build MpvQt
        run: |
          git clone -q --depth 1 --branch v1.2.1 https://invent.kde.org/libraries/mpvqt.git "$RUNNER_TEMP/mpvqt-src"
          expected=8a4d1ae9d1a1c5c94cd96bccb5330b83c1704b99
          found=$(git -C "$RUNNER_TEMP/mpvqt-src" rev-parse HEAD)
          [ "$found" = "$expected" ] || { echo "error: MpvQt's tag v1.2.1 is at $found, not $expected" >&2; exit 1; }
          cmake -S "$RUNNER_TEMP/mpvqt-src" -B "$RUNNER_TEMP/mpvqt-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/mpvqt" -DCMAKE_PREFIX_PATH="$(brew --prefix)"
          cmake --build "$RUNNER_TEMP/mpvqt-build"
          cmake --install "$RUNNER_TEMP/mpvqt-build"
      - name: Install uniffi-bindgen-cpp
        run: cargo install uniffi-bindgen-cpp --git https://github.com/NordSecurity/uniffi-bindgen-cpp --tag v0.10.0+v0.31.0 --locked
      - run: cmake -S gui/qt -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/mpvqt;$(brew --prefix)"
      - name: qmllint
        run: cmake --build build --target all_qmllint
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure --no-tests=error
