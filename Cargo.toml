# No package of its own: a cargo command run here covers every member, which is how CI and
# dev/check-all.sh build, lint and test them all with the same commands.
[workspace]
members = ["core", "cli"]
# A virtual root has no package edition to take the resolver from: without this line cargo uses
# resolver 1, which lets dev-dependencies' features (core's `test-support`) into normal builds.
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# `Duration::from_mins` in a const.
rust-version = "1.91"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# `group`'s read of a signal's disposition, which no safe crate offers, and its tests' `pre_exec`
# calls; and libc's constants.
libc = "0.2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Default backend is miniz_oxide: pure Rust, so no zlib to link.
flate2 = "1"
thiserror = "2"
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The review screen.
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
crossterm = "0.29.0"
# `audio`'s cross-correlation. Pure Rust, like flate2's backend.
rustfft = "6"
# Safe calls for what std lacks: signals taken on a thread of their own (`group`), process groups
# killed, a filesystem's free space, read-ahead hints. Both come into the build through crossterm
# already; rustix's `process` and `fs` features are ours.
signal-hook = "0.3"
rustix = { version = "1", features = ["fs", "process"] }
# The store: SQLite compiled in (`bundled`), so there is no system library to find, and it builds
# the same on macOS; it needs a C compiler. `fallible_uint` lets a u64 or usize be a parameter,
# refused rather than wrapped past i64::MAX.
rusqlite = { version = "=0.40.2", features = ["bundled", "fallible_uint"] }
tempfile = "3"

# CI gates on `cargo clippy --all-targets -- -D warnings`, so pedantic is effectively deny. The
# next three allows are library-author lints, off because `pub` here marks the seams between this
# workspace's crates and modules, not an API anyone outside it calls.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Matroska's element names (SimpleBlock, TimestampScale, CodecPrivate, ...) are the vocabulary of
# nearly every doc comment here. Backticking each one would make the prose read like code.
doc_markdown = "allow"
