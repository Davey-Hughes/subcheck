name: CI

# `branches: [main]` on push, rather than every push everywhere. main is
# protected and takes changes only through a pull request, so a push event on a
# feature branch would just run the same jobs the PR is already running, twice.
# What is left is the two moments that matter: the PR, and main after the merge.
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# This file is the Forgejo half of a two-forge CI, and the half that gates.
# .github/workflows/ci.yml exists because this instance has docker runners
# only, so the macOS jobs run there and nowhere here.
#
# It is NOT a pre-merge gate, though. Nothing pushes to GitHub by hand: the forge
# push-mirrors every branch there, so the macOS jobs do run on a pull request's
# branch, as a `push` event, shortly after each push. But its result never
# reaches the Forgejo pull request, so nothing stops a merge on a red macOS run.
# Before merging, look:
#
#   gh run list -R Davey-Hughes/subcheck --branch <branch>
#
# A macOS failure found only after the merge means main is broken: fix forward.
#
# Both jobs clone with git rather than with actions/checkout, and the reason is
# worth stating because the failure it avoids is silent. checkout is a
# JavaScript action, and a JS action needs a node inside the job's container to
# execute. Neither job's image carries one, and this runner does not inject one,
# so a job combining `container:` with any JS action dies before its first step.
#
# The clone is authenticated because the instance requires sign-in for all
# content, so an anonymous fetch is refused even for a public repository. The
# runner supplies FORGEJO_TOKEN for exactly this, and FORGEJO_SERVER_URL is the
# runner's own view of the forge -- an address on its container network --
# rather than the public hostname.
#
# The subcheck job runs in rust:1.99.1-bookworm, the version rust-toolchain.toml
# names, as does advisories.yml's job, and all three move together (the file
# says how). A floating rust:1-bookworm lets the runner keep whatever copy it
# pulled last. An exact tag cannot go stale, and with it matching the file
# rustup has nothing to download in the job. Should they ever differ, the file
# wins: rustup honours it inside the image too.

jobs:
  # The `apply` tests remux with mkvmerge and the `audio` tests decode with
  # ffmpeg. They skip without them, so the job sets SUBCHECK_NEED_MKVMERGE and
  # SUBCHECK_NEED_FFMPEG to make a missing one fail them instead. The tests read
  # MKV fixtures committed under core/tests/fixtures/; dev/make-fixtures.sh
  # builds them, only when a fixture changes. dev/check-all.sh runs these same
  # steps locally: change it with this file.
  subcheck:
    name: subcheck
    runs-on: docker
    container:
      image: rust:1.99.1-bookworm
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          host="${FORGEJO_SERVER_URL#http://}"; host="${host#https://}"
          scheme="${FORGEJO_SERVER_URL%%://*}"
          git init -q .
          git remote add origin "${scheme}://x-access-token:${TOKEN}@${host}/${FORGEJO_REPOSITORY}.git"
          git fetch -q --depth 1 origin "$FORGEJO_REF"
          git checkout -q FETCH_HEAD

      # A dev script no test runs can carry a stray quote or a missing `fi` to
      # main with CI green. This is the check that is about syntax.
      - name: Syntax check
        run: for f in dev/*.sh; do bash -n "$f"; done

      # The image's minimal rustup profile has none of the three, and what the
      # image happens to carry is not something to lean on, so they are added
      # here by name. llvm-tools is what cargo llvm-cov reads coverage with. It
      # stays out of rust-toolchain.toml, which would download it for every cargo
      # run in the repository, the GitHub legs and every build from source among
      # them.
      - name: Install rustfmt, clippy and llvm-tools
        run: rustup component add rustfmt clippy llvm-tools

      # A prebuilt release binary, not `cargo install`, which would compile it in
      # every job. The musl build is static, so it runs on bookworm's glibc.
      #
      # The digest is not upstream's: the release publishes no checksum for this
      # asset, and a release asset can be replaced in place. To move on, change
      # the version and the digest together, the digest from a download of the
      # new version, never copied from anywhere else. dev/check-all.sh reads
      # the version out of the URL below, so it stays the one URL of its kind.
      - name: Install cargo-llvm-cov
        run: |
          curl -fsSL -o /tmp/llvm-cov.tar.gz \
            https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.9.1/cargo-llvm-cov-x86_64-unknown-linux-musl.tar.gz
          echo "3fca950394a3c49457657c158b1619cec8dfd2647ae5b48746734c0ab969a522  /tmp/llvm-cov.tar.gz" | sha256sum -c -
          tar -xzf /tmp/llvm-cov.tar.gz -C /usr/local/bin
          cargo llvm-cov --version

      # From MKVToolNix's own apt repository, pinned: bookworm's is 74.0, years behind the
      # mkvmerge that remuxes the library, and apply's check models what mkvmerge writes. The
      # repository keeps old releases, so the pin holds; to move on, change it here and in
      # .github/workflows/ci.yml. Its signing key must be the one keyserver.ubuntu.com has too,
      # alone in the file.
      - name: Install mkvtoolnix
        run: |
          . /etc/os-release
          key=/etc/apt/keyrings/gpg-pub-moritzbunkus.gpg
          install -d /etc/apt/keyrings
          curl -fsSL -o "$key" https://mkvtoolnix.download/gpg-pub-moritzbunkus.gpg
          fpr=$(gpg --show-keys --with-colons "$key" | awk -F: '$1 == "pub" { getline; print $10 }')
          [ "$fpr" = D9199745B0545F2E8197062B0F92290A445B9007 ] || { echo "unexpected MKVToolNix key: $fpr" >&2; exit 1; }
          echo "deb [signed-by=$key] https://mkvtoolnix.download/$ID/ $VERSION_CODENAME main" >/etc/apt/sources.list.d/mkvtoolnix.list
          apt-get update && apt-get install -y --no-install-recommends 'mkvtoolnix=103.0-*'

      # bookworm's own (5.1): the newer ffmpeg checked gives `audio` the same
      # output on the fixtures.
      - name: Install ffmpeg
        run: apt-get install -y --no-install-recommends ffmpeg

      # So the log says which Rust this was (see the header).
      - run: rustc --version
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

      # The test step: `cargo llvm-cov` runs `cargo test` with the build
      # instrumented, and fails the job when the share of lines the tests reach
      # falls under the floor. The share counts test code too (the in-file test
      # modules, core/src/test_support.rs), not only the code that ships.
      #
      # 90 is chosen, not derived. It leaves room for code the Rust tests reach
      # poorly, such as an FFI layer driven from another language or
      # platform-conditional code, to land without lowering the floor in the same
      # pull request. dev/check-all.sh reads the floor out of the `floor=` line
      # below, so it stays a line of its own and the one such line in this file.
      # cargo llvm-cov fails under the floor without saying so, hence the
      # message.
      - name: Tests, with coverage
        run: |
          floor=90
          cargo llvm-cov --fail-under-lines "$floor" || {
            echo "error: cargo llvm-cov failed. If it built and every test passed, compare TOTAL's Lines Cover with the $floor% floor" >&2
            exit 1
          }
        env:
          SUBCHECK_NEED_MKVMERGE: "1"
          SUBCHECK_NEED_FFMPEG: "1"

      # cargo llvm-cov does not run doctests (instrumenting them needs nightly),
      # so they run here, uninstrumented. The step is there so that a doctest,
      # once written, runs.
      - name: Doctests
        run: cargo test --doc

  # The Qt app (gui/qt/): its C++ bindings to ffi/, generated at build time, its window, and its
  # tests, with a floor under the share of the window's C++ lines they reach. Not a merge gate:
  # branch protection requires `CI / subcheck (pull_request)` alone, by that exact name. It runs on
  # Arch, the desktop the app is built for first, with packages as new as that desktop's. Two things
  # can break it with no change in the repository: an Arch upgrade, and the image, which this runner
  # keeps as it first pulled it, so that every run upgrades an older copy (hence the keyring first,
  # below). If either gets noisy, pin the image to a dated Arch Linux Archive snapshot. Nothing is
  # cached, as this runner runs no JS actions, so the bindgen compiles every time. No path filter
  # either: a change to core can break ffi/ or the app. It waits for `subcheck`, so that the gating
  # job's result comes first, and the two of one run never build side by side on the one machine
  # this runner shares. dev/check-gui.sh runs these same steps locally: change it with this job.
  gui:
    name: gui
    needs: subcheck
    runs-on: docker
    # A hang outside the tests, which CTest limits one by one (gui/qt/CMakeLists.txt), fails the job
    # rather than holding the runner until its own limit: a download, pacman, a build.
    timeout-minutes: 20
    container:
      image: archlinux:base-devel
    steps:
      # The keyring first: pacman checks every package against the keyring it has before it
      # installs any, a new keyring among them, and the runner's copy of the image only ages. A new
      # keyring is taken in only with a local key to sign it, which an older image may lack:
      # `pacman-key --init` makes one if it is missing.
      #
      # git for the checkout, which the image lacks. corrosion depends on `rust`, which rustup
      # provides; without rustup here, that is Arch's rust package, which ignores
      # rust-toolchain.toml. The check is that rustup is what provides it: `pacman -Q` answers for
      # whichever package does.
      - name: Install the tools
        run: |
          pacman-key --init
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Su --noconfirm --needed git rustup cmake ninja clang corrosion qt6-base qt6-declarative gcovr
          [ "$(pacman -Qq rust)" = rustup ] || {
            echo "error: Arch's rust package came in, and ignores rust-toolchain.toml" >&2
            exit 1
          }

      - name: Checkout
        env:
          TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          host="${FORGEJO_SERVER_URL#http://}"; host="${host#https://}"
          scheme="${FORGEJO_SERVER_URL%%://*}"
          git init -q .
          git remote add origin "${scheme}://x-access-token:${TOKEN}@${host}/${FORGEJO_REPOSITORY}.git"
          git fetch -q --depth 1 origin "$FORGEJO_REF"
          git checkout -q FETCH_HEAD

      # The toolchain rust-toolchain.toml names, which Corrosion and the bindgen build with.
      - name: Install Rust
        run: rustup toolchain install

      # So the log says which Rust this was.
      - run: rustc --version

      # Our C++ against gui/qt/.clang-format, before the slow steps. An empty list stops it, as
      # clang-format given no file reads an empty stdin and passes.
      - name: clang-format
        run: |
          [ -n "$(git ls-files 'gui/qt/*.cpp' 'gui/qt/*.h' 'gui/qt/*.hpp')" ] || {
            echo "error: no C++ under gui/qt/ for clang-format to check" >&2
            exit 1
          }
          git ls-files -z 'gui/qt/*.cpp' 'gui/qt/*.h' 'gui/qt/*.hpp' | xargs -0 clang-format --dry-run -Werror

      # The bindgen, outside the workspace: as a member, every clippy run would compile it. Its
      # tag names the uniffi it is built against, which the root Cargo.toml pins: the two move
      # together, and the same line is in .github/workflows/ci.yml. dev/check-gui.sh reads the tag
      # out of this line, so it stays the one such line in this file.
      - name: Install uniffi-bindgen-cpp
        run: cargo install uniffi-bindgen-cpp --git https://github.com/NordSecurity/uniffi-bindgen-cpp --tag v0.10.0+v0.31.0 --locked

      # Built for gcov, so that the tests run once and the floor below reads what they reached.
      - run: cmake -S gui/qt -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DSUBCHECK_COVERAGE=ON

      # Our QML, against the types our C++ gives it, which this builds first, the Rust under it
      # included. A warning fails it, as gui/qt/.qmllint.ini says.
      - name: qmllint
        run: cmake --build build --target all_qmllint

      # A warning in our C++, or in the C++ Qt generates for it, fails the build; one in the
      # bindings' generated .cpp, or in the QML plugin's, does not, as gui/qt/CMakeLists.txt says.
      # Then the tests, which seed their runs with a real scan. Finding no tests fails the step, as
      # CTest alone passes with none run.
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure --no-tests=error

      # The share of our C++'s lines the tests reach (gui/qt/src/, less main.cpp, which only wires
      # the parts together, and which app_starts runs), and the floor it must not fall under, as
      # the Rust's in the subcheck job. A line counts as reached when any copy of it the compiler
      # made ran: a destructor's line has one per kind of destructor, and the deleting one never
      # runs here. gcovr says when the share is under the floor. dev/check-gui.sh reads the floor
      # out of the `cpp_floor=` line below, so it stays the one such line in this file.
      - name: C++ coverage
        run: |
          cpp_floor=90
          gcovr --root . --filter gui/qt/src/ --exclude gui/qt/src/main.cpp --merge-lines --fail-under-line "$cpp_floor" build
